- tags:
    - emacs
  vars:
    doom_directory: "{{ ansible_env.HOME }}/.config/doom"
    doom_emacs_directory: "{{ ansible_env.HOME }}/.config/emacs"
    # Emacs built from source on WSL: https://ftp.gnu.org/gnu/emacs/
    emacs_source_version: "30.2"
    emacs_source_directory: "/tmp/emacs-{{ emacs_source_version }}"
    # snap installs emacs into /snap/bin, and make install into /usr/local/bin
    emacs_path: "/snap/bin:/usr/local/bin:{{ ansible_env.PATH }}"
    nerd_font_directory: "{{ ansible_env.HOME }}/.local/share/fonts/NerdFontsSymbolsOnly"
  block:
    # stdout is "t" only when Emacs is installed with native compilation
    - name: Check if Emacs is installed
      ansible.builtin.command:
        argv:
          - emacs
          - --batch
          - --eval
          - "(princ (and (fboundp 'native-comp-available-p) (native-comp-available-p)))"
      environment:
        PATH: "{{ emacs_path }}"
      register: emacs_check
      changed_when: false
      failed_when: false
      check_mode: false

    - name: Install Emacs by snap
      when: emacs_check.rc != 0 and not is_wsl
      become: true
      community.general.snap:
        name: emacs
        classic: true

    # Rebuilds an existing Emacs without native compilation too
    - name: Build Emacs from source on WSL
      when: emacs_check.stdout | default('') != 't' and is_wsl
      block:
        - name: Install Emacs build dependencies
          become: true
          ansible.builtin.apt:
            name:
              - build-essential
              - texinfo
              - libgtk-3-dev
              - libgnutls28-dev
              - libncurses-dev
              - libjansson-dev
              - libtree-sitter-dev
              - libxml2-dev
              - libxpm-dev
              - libjpeg-dev
              - libpng-dev
              - libgif-dev
              - libtiff-dev
              - libsqlite3-dev
              # libgccjit-14 is found only by gcc-14, not by the default gcc
              - gcc-14
              - libgccjit-14-dev
            state: present

        # Start from a clean source tree, so an earlier build isn't reused
        - name: Remove an earlier Emacs source
          ansible.builtin.file:
            path: "{{ emacs_source_directory }}"
            state: absent

        - name: Download and extract the Emacs source
          ansible.builtin.unarchive:
            remote_src: true
            src: "https://ftp.gnu.org/gnu/emacs/emacs-{{ emacs_source_version }}.tar.xz"
            dest: /tmp

        # --with-native-compilation fails instead of building without it
        - name: Configure Emacs
          ansible.builtin.command:
            cmd: ./configure --with-native-compilation
            chdir: "{{ emacs_source_directory }}"
          environment:
            CC: gcc-14

        - name: Build Emacs
          ansible.builtin.command:
            cmd: "make -j{{ ansible_processor_nproc }}"
            chdir: "{{ emacs_source_directory }}"

        - name: Install Emacs
          become: true
          ansible.builtin.command:
            cmd: make install
            chdir: "{{ emacs_source_directory }}"

    - ansible.builtin.file:
        path: "{{ doom_directory }}"
        state: directory
        mode: "0700"

    # Changes to init.el or packages.el take effect only after `doom sync`.
    - ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ doom_directory }}/{{ item }}"
        mode: "0600"
      loop:
        - init.el
        - config.el
        - packages.el

    # Local packages in packages.el, copied as is because they are not
    # templates. Changes take effect only after `doom sync`.
    - ansible.builtin.file:
        path: "{{ doom_directory }}/lisp/daylight-theme"
        state: directory
        mode: "0700"
    - ansible.builtin.copy:
        src: daylight-theme/daylight-theme.el
        dest: "{{ doom_directory }}/lisp/daylight-theme/daylight-theme.el"
        mode: "0600"

    - name: Install Doom Emacs dependencies
      become: true
      ansible.builtin.apt:
        name:
          - git
          - ripgrep
          - fd-find
          # Fallback font for characters other fonts can't render
          - fonts-symbola
          - fontconfig
          # Compiler for markdown-preview in :lang markdown
          - markdown
          # Linter for :lang sh
          - shellcheck
        state: present

    # Icons in Doom, the same font `M-x nerd-icons-install-fonts' installs
    - name: Install Symbols Nerd Font
      block:
        - ansible.builtin.file:
            path: "{{ nerd_font_directory }}"
            state: directory
            mode: "0755"
        - ansible.builtin.unarchive:
            remote_src: true
            src: https://github.com/ryanoasis/nerd-fonts/releases/latest/download/NerdFontsSymbolsOnly.tar.xz
            dest: "{{ nerd_font_directory }}"
            creates: "{{ nerd_font_directory }}/SymbolsNerdFontMono-Regular.ttf"
          register: nerd_font
        - when: nerd_font.changed
          ansible.builtin.command: fc-cache -f "{{ nerd_font_directory }}"

    # Previewer for grip-mode in :lang markdown +grip. It renders locally,
    # unlike grip, which sends the file to the GitHub API.
    - name: Install go-grip
      ansible.builtin.command:
        cmd: go install github.com/chrishrb/go-grip@latest
        creates: "{{ ansible_env.HOME }}/go/bin/go-grip"
      environment:
        GOPATH: "{{ ansible_env.HOME }}/go"
        PATH: "/usr/local/go/bin:{{ ansible_env.PATH }}"

    # https://github.com/doomemacs/doomemacs#install
    - name: Clone Doom Emacs
      ansible.builtin.git:
        repo: https://github.com/doomemacs/doomemacs
        dest: "{{ doom_emacs_directory }}"
        depth: 1
        # Doom is upgraded by `doom upgrade`, not by this playbook
        update: false
      register: doom_clone

    # --no-config keeps the templated files in ~/.config/doom
    - name: Install Doom Emacs
      when: doom_clone.changed
      ansible.builtin.command:
        cmd: "{{ doom_emacs_directory }}/bin/doom install --force --no-config"
      environment:
        PATH: "{{ emacs_path }}"
