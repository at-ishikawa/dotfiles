- tags:
    - doom-emacs
  vars:
    doom_directory: "{{ ansible_env.HOME }}/.config/doom"
  block:
    - ansible.builtin.file:
        path: "{{ doom_directory }}"
        state: directory
        mode: "0700"

    # Changes to init.el or packages.el take effect only after `doom sync`.
    - ansible.builtin.template:
        src: "{{ item }}"
        dest: "{{ doom_directory }}/{{ item }}"
        mode: "0600"
      loop:
        - init.el
        - config.el
        - packages.el
